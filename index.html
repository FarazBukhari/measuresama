<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Measure Sama – A free tape measure for your phone</title>
    <meta name="description" content="Measure distances with your phone camera, or use the on-screen ruler. Free, private and works offline." />
    <meta name="theme-color" content="#F4F4F1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Measure Sama" />
    <meta property="og:title" content="Measure Sama" />
    <meta property="og:description" content="A free tape measure for your phone. Private and offline." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = JSON.parse(localStorage.getItem('measuresama:theme') || '"system"')
        var d = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (d) {
          document.documentElement.classList.add('dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0F0F0F')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>Measure Sama needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
